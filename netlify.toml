[build]
  command = "npm run build"
  # Leave publish unset so @netlify/plugin-nextjs owns the output dir.
  # In the Netlify UI, clear Publish directory if it was set to ".next".

[build.environment]
  # Next.js 16 requires Node.js 20.9+
  NODE_VERSION = "22"
  # NEXT_PUBLIC_* is intentionally inlined into the client bundle.
  # LANGSMITH_ENDPOINT is a public API base URL, not a credential.
  SECRETS_SCAN_OMIT_KEYS = "NEXT_PUBLIC_YOUTUBE_API_KEY,LANGSMITH_ENDPOINT"
